# Copy this file to config/local.conf and replace every placeholder.
# Keep config/local.conf private; it is ignored by Git.

# Use "direct" when the operating system already has a route to the server.
# Use "zerotier" when the route is provided by an authorized ZeroTier network.
UNITY_NETWORK_PROVIDER="zerotier"
UNITY_NETWORK_ID="0000000000000000"
UNITY_NETWORK_NAME="Example ZeroTier network"

# Network changes are opt-in. When true, "floating" may join the configured
# ZeroTier network and enable its managed routes. Authorization on the network
# controller still has to be granted separately.
UNITY_NETWORK_ALLOW_CHANGES="false"

UNITY_LICENSE_SERVER_URL="http://license-server.example.invalid:1554"
UNITY_LICENSE_CLI="/usr/local/bin/unity-license"
# Unity.Licensing.Client requires the token as an argument. Use "stdin" only
# with a custom wrapper that explicitly reads the token from standard input.
UNITY_LICENSE_CLI_MODE="argument"

# Legacy aliases UNITY_ZEROTIER_NETWORK_ID and UNITY_ZEROTIER_NETWORK_NAME
# remain supported for existing local configuration files.
